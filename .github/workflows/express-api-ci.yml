name: Mctaba Express API CI

on:
  push:
    branches:
      - feature/express-postgres-foundation
    paths:
      - 'backend/express/**'
      - '.github/workflows/express-api-ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'backend/express/**'
      - '.github/workflows/express-api-ci.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mctaba_test
          POSTGRES_PASSWORD: mctaba_test
          POSTGRES_DB: mctaba_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mctaba_test -d mctaba_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend/express
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://mctaba_test:mctaba_test@localhost:5432/mctaba_test
      CORS_ORIGINS: http://localhost:5173
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Run API smoke tests
        run: npm test
      - name: Apply initial schema to disposable PostgreSQL
        run: npm run migrate:up
