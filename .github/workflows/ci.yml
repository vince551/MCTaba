name: Mctaba CI

on:
  push:
    branches:
      - main
      - feature/mctaba-foundation
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install frontend dependencies
        run: npm install
      - name: Build frontend
        run: npm run build
      - name: Install Cloud Functions dependencies
        working-directory: functions
        run: npm install
      - name: Check Cloud Functions syntax
        working-directory: functions
        run: npm run lint
