name: Laravel backend checks

on:
  push:
    branches: [main, feature/laravel-postgres-migration]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Validate Composer manifest
        run: composer validate --no-check-publish backend/composer.json
      - name: Lint PHP source files
        shell: bash
        run: find backend -type f -name '*.php' -print0 | xargs -0 -n1 php -l