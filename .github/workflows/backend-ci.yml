name: Laravel backend checks

on:
  push:
    branches: [main, feature/laravel-postgres-migration]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  laravel-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: mbstring, pdo_sqlite, sqlite3, pdo_pgsql
      - name: Validate Composer manifest
        run: composer validate --no-check-publish backend/composer.json
      - name: Install backend dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist
      - name: Lint PHP source files
        shell: bash
        run: |
          find backend/app backend/bootstrap backend/config backend/database backend/public backend/routes backend/tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          php -l backend/artisan
      - name: Run Laravel tests
        working-directory: backend
        run: php artisan test
